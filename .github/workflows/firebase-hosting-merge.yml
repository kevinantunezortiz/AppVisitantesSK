name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- PASOS FALTANTES QUE DEBES AGREGAR ---
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # Actualizamos a la versión recomendada por GitHub

      - name: Install Dependencies
        run: npm install --force # Agregamos --force aquí también para evitar fallos en el servidor

      - name: Build Project
        run: npm run build
      # ---------------------------------------

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_APPVISITANTES_C3B62 }}
          channelId: live
          projectId: appvisitantes-c3b62
